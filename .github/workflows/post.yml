name: post

# Drie posts per dag om 10:00, 13:00 en 20:00 Nederlandse tijd. GitHub kent alleen UTC, dus de run start op alle
# UTC-uren die in zomer- of wintertijd op die vakken vallen; poster.py --rooster beslist zelf of er een vak open is
# en post maximaal één keer per vak per dag. Twee starttijden per uur voor als GitHub een geplande run overslaat.
on:
  schedule:
    - cron: "3 8,9,11,12,18,19 * * *"
    - cron: "33 8,9,11,12,18,19 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "droog = alleen tonen, nu = volgende post direct plaatsen"
        type: choice
        options: [droog, nu]
        default: droog

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Post
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODUS: ${{ github.event_name == 'schedule' && 'rooster' || inputs.modus }}
        run: python3 poster.py --"$MODUS"

      - name: Status terugschrijven
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wachtrij gepost log.txt
          if git diff --cached --quiet; then echo "niets te committen"; exit 0; fi
          git commit -m "post: $(tail -1 log.txt)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "push mislukt" && exit 1
