name: post

# Drie posts per dag om 10:00, 13:00 en 20:00 Nederlandse tijd. GitHub kent alleen UTC, dus de run start op alle
# UTC-uren die in zomer- of wintertijd op die vakken vallen; poster.py --rooster beslist zelf of er een vak open is
# en post maximaal één keer per vak per dag. GitHub slaat geplande runs op nieuwe of rustige repo's vaak over (19-10:
# de hele dag geen enkele), en het vaakst rond het hele uur. Daarom elke tien minuten op een rustige minuut, door het
# hele venster van 120 minuten na elk vak; buiten een vak stopt de run na een paar seconden.
# Een externe trigger mag workflow_dispatch met modus=rooster aanroepen: die volgt dezelfde vakregels, dus nooit dubbel.
# Commit dit bestand alleen als silprins-a11y (git user.email 241277139+silprins-a11y@users.noreply.github.com).
on:
  schedule:
    - cron: "7,17,27,37,47,57 8-13,18-20 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "droog = alleen tonen, nu = volgende post direct plaatsen, rooster = alleen als er een vak open is"
        type: choice
        options: [droog, nu, rooster]
        default: droog

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # post + reel: Instagram verwerkt de video soms minuten
    steps:
      - uses: actions/checkout@v4

      - name: Post
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODUS: ${{ github.event_name == 'schedule' && 'rooster' || inputs.modus }}
        run: python3 poster.py --"$MODUS"

      - name: Status terugschrijven
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wachtrij gepost log.txt
          if git diff --cached --quiet; then echo "niets te committen"; exit 0; fi
          git commit -m "post: $(tail -1 log.txt)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "push mislukt" && exit 1
